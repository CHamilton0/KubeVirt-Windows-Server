---
- name: Download virtio drivers
  ansible.builtin.get_url:
    url: https://fedorapeople.org/groups/virt/virtio-win/direct-downloads/archive-virtio/virtio-win-0.1.285-1/virtio-win-0.1.285.iso
    dest: "{{ role_path }}/../common/files/isos/virtio-win-0.1.285.iso"
    mode: "0644"

- name: Download Windows Server ISO
  ansible.builtin.get_url:
    url: https://software-download.microsoft.com/download/sg/20348.169.210806-2348.fe_release_svc_refresh_SERVER_EVAL_x64FRE_en-us.iso
    dest: "{{ role_path }}/../common/files/isos/WindowsServer2022.iso"
    mode: "0644"
