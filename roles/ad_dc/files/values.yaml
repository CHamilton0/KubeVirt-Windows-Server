# Disks for runtime VM
disks:
  - name: os-disk
    disk:
      bus: virtio
    bootOrder: 1

  # Unattended install ISO
  - name: bootstrap
    cdrom:
      bus: sata

  - name: secret-vol
    cdrom:
      bus: sata

# Volumes for runtime VM
volumes:
  - name: os-disk
    dataVolume:
      name: os-dv

  - name: bootstrap
    dataVolume:
      name: bootstrap-iso

  - name: secret-vol
    secret:
      secretName: admin-password
