---
# Create specliaise ISO
- name: Install pycdlib module
  ansible.builtin.pip:
    name: pycdlib

- name: Create bootstrap ISO for KubeVirt
  community.general.iso_create:
    src_files:
      - "{{ role_path }}/../common/files/bootstrap/bootstrap.ps1"
    dest_iso: "{{ role_path }}/../common/files/isos/bootstrap.iso"
    interchange_level: 3
    joliet: 3
    vol_ident: AUTOUNATTEND
    rock_ridge: "1.09"

- name: Install Kubernetes Python module
  ansible.builtin.pip:
    name: kubernetes

- name: Create VM namespace
  kubernetes.core.k8s:
    api_version: v1
    kind: Namespace
    name: "{{ common_namespace }}"
    state: present

- name: Check if Python HTTP server is running on port 8000
  ansible.builtin.command: lsof -i :8000
  register: windows_instance_http_server_check
  ignore_errors: true
  changed_when: false

- name: Start Python HTTP server to serve ISOs if not running
  ansible.builtin.shell: >
    nohup python3 -m http.server 8000 > /tmp/isos-http.log 2>&1 &
  args:
    chdir: "{{ role_path }}/../common/files/isos"
  async: 1000
  poll: 0
  when: windows_instance_http_server_check.rc != 0
  changed_when: windows_instance_http_server_check.rc != 0

- name: Pick the first 192.* IP address
  ansible.builtin.set_fact:
    windows_instance_localhost_ip: "{{ ansible_all_ipv4_addresses | select('match', '^192\\.') | list | first }}"

# -----------------------------
# Runtime VM
# -----------------------------
- name: Include secrets variables
  ansible.builtin.include_vars:
    file: "{{ role_path }}/secrets.enc.yaml"

- name: Deploy Windows VM
  kubernetes.core.helm:
    name: "{{ common_vm_name }}"
    chart_ref: "{{ role_path }}/../../helm"
    namespace: "{{ common_namespace }}"
    values_files:
      - "{{ role_path }}/../../helm/values.yaml"
    values:
      runStrategy: Once # Run once to finish setting up VM
      osDiskURL: "http://{{ windows_instance_localhost_ip }}:8000/golden.img"
      bootstrapURL: "http://{{ windows_instance_localhost_ip }}:8000/bootstrap.iso"
      adminPassword: "{{ vault_admin_password }}"

- name: Wait for the VM to enter Succeeded phase
  until: windows_instance_vmi_status.resources[0].status.phase == "Succeeded"
  retries: 60
  delay: 30
  kubernetes.core.k8s_info:
    api_version: kubevirt.io/v1
    kind: VirtualMachineInstance
    name: "{{ common_vm_name }}-vm"
    namespace: "{{ common_namespace }}"
  register: windows_instance_vmi_status

- name: Get current VM state
  kubernetes.core.k8s_info:
    kind: VirtualMachine
    name: "{{ common_vm_name }}-vm"
    namespace: "{{ common_namespace }}"
  register: current_vm

- name: Build Dynamic Patch Operations
  set_fact:
    cleanup_patch: >-
      {% set ops = [] %}
      {% set volumes = current_vm.resources[0].spec.template.spec.volumes | default([]) %}
      {% set targets = [] %}
      {% for vol in volumes %}
        {% if vol.name in ['secret-vol', 'bootstrap'] %}
          {% set _ = targets.append({'index': loop.index0, 'name': vol.name}) %}
        {% endif %}
      {% endfor %}
      {% for target in targets | sort(attribute='index', reverse=True) %}
        {% set _ = ops.append({'op': 'remove', 'path': '/spec/template/spec/domain/devices/disks/' ~ target.index}) %}
        {% set _ = ops.append({'op': 'remove', 'path': '/spec/template/spec/volumes/' ~ target.index}) %}
      {% endfor %}
      {% if current_vm.resources[0].spec.runStrategy | default('') != 'Always' %}
        {% set _ = ops.append({'op': 'replace', 'path': '/spec/runStrategy', 'value': 'Always'}) %}
      {% endif %}
      {{ ops | to_json }}

- name: Execute Idempotent Dynamic Cleanup
  kubernetes.core.k8s_json_patch:
    kind: VirtualMachine
    name: "{{ common_vm_name }}-vm"
    namespace: "{{ common_namespace }}"
    patch: "{{ cleanup_patch | from_json }}"
  when: (cleanup_patch | from_json | length > 0)
