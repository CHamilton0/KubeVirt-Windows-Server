# Minimum values.yaml for Windows Server KubeVirt VM

# VM configuration
vmName: "windows-server-2022"
runStrategy: Once

# Resources
cpu:
  cores: 2
memory: "4Gi"

# Storage
storageClassName: local-path
storage:
  osDiskSize: 60Gi
  isoSize: 10Gi
  virtioSize: 2Gi
  unattendSize: 10Mi

# VM Labels
vmLabels:
  kubevirt.io/size: small
  kubevirt.io/domain: testvm

# Network
networks:
  - name: default
    pod: {}
