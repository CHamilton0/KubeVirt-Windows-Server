# Minimum values.yaml for Windows Server KubeVirt VM

# VM configuration
vmName: "windows-server-2022"
runStrategy: Always

# Resources
cpu:
  cores: 2
memory: "4Gi"

# Storage
storageClassName: local-path
storage:
  osDiskSize: 60Gi
  isoSize: 10Gi
  virtioSize: 2Gi
  unattendSize: 10Mi

# ISO locations (can be local HTTP server or remote URLs)
isoURL: "http://127.0.0.1:8000/WindowsServer2022.iso"
virtioURL: "http://127.0.0.1:8000/virtio-win-0.1.285.iso"
unattendURL: "http://127.0.0.1:8000/unattend.iso"

# VM Labels
vmLabels:
  kubevirt.io/size: small
  kubevirt.io/domain: testvm

# Network
networks:
  - name: default
    pod: {}

# Disks
disks:
  - name: windows-iso
    cdrom:
      bus: sata
    bootOrder: 1
  - name: os-disk
    disk:
      bus: virtio
    bootOrder: 2
  - name: virtio-drivers
    cdrom:
      bus: sata
  - name: unattend
    cdrom:
      bus: sata

# Data volumes
volumes:
  - name: os-disk
    persistentVolumeClaim:
      claimName: os-pvc
  - name: windows-iso
    dataVolume:
      name: windows-server-iso
  - name: virtio-drivers
    dataVolume:
      name: virtio-drivers
  - name: unattend
    dataVolume:
      name: unattend-iso
