---
apiVersion: cdi.kubevirt.io/v1beta1
kind: DataVolume
metadata:
  name: "{{ .Release.Name }}-os-dv"
spec:
  source:
    http:
      url: "{{ .Values.osDiskURL }}"
  pvc:
    accessModes:
      - ReadWriteOnce
    resources:
      requests:
        storage: {{ .Values.storage.osDiskSize }}
    storageClassName: {{ .Values.storageClassName }}

---
apiVersion: cdi.kubevirt.io/v1beta1
kind: DataVolume
metadata:
  name: "{{ .Release.Name }}-bootstrap-iso"
spec:
  source:
    http:
      url: "{{ .Values.bootstrapURL }}"
  pvc:
    accessModes:
      - ReadWriteOnce
    resources:
      requests:
        storage: {{ .Values.storage.unattendSize }}
    storageClassName: {{ .Values.storageClassName }}
